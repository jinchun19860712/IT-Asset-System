  - name: 服务器通用模板
    vendor: 通用
    device_types:
      - 服务器
      - 存储
    metrics:
      - name: CPU利用率
        oid: 1.3.6.1.4.1.2021.11.9.0
        type: percentage
        unit: '%'
      - name: 内存利用率
        oid: 1.3.6.1.4.1.2021.4.6.0
        type: percentage
        unit: '%'
      - name: 磁盘使用率
        oid: 1.3.6.1.4.1.2021.9.1.9.1
        type: percentage
        unit: '%'
      - name: 运行时间
        oid: 1.3.6.1.2.1.1.3.0
        type: counter

  - name: UPS通用模板
    vendor: 通用
    device_types:
      - UPS
      - 动环设备
    metrics:
      - name: 电池剩余容量
        oid: 1.3.6.1.2.1.33.1.2.4.0
        type: percentage
        unit: '%'
      - name: 输入电压
        oid: 1.3.6.1.2.1.33.1.3.3.1.3.1
        type: number
        unit: V
      - name: 输出负载率
        oid: 1.3.6.1.2.1.33.1.4.4.1.5.1
        type: percentage
        unit: '%'
      - name: 电池温度
        oid: 1.3.6.1.2.1.33.1.2.7.0
        type: number
        unit: '℃'
